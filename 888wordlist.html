<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>专升本核心词汇888 · 交互练习</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='6' width='24' height='22' rx='3' fill='%231F4E79'/%3E%3Cpath d='M10 12h12M10 17h12M10 22h7' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --theme:#1F4E79; --assoc:#2E6DA4; --bg:#F2F6FA; --line:#D9E2EC;
  --ink:#22262B; --sub:#5A6675; --ok:#1E8E5A; --err:#C0392B;
  --card:#FFFFFF; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif}
button{font-family:inherit}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 40px}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:44px}
.topbar .back{background:none;border:1px solid var(--line);border-radius:10px;width:44px;height:44px;font-size:18px;color:var(--theme);cursor:pointer;flex:0 0 44px}
.topbar .bt{flex:1;min-width:0}
.topbar h1{font-size:17px;color:var(--theme);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 首页 ---------- */
.hero{padding:18px 4px 8px}
.hero h1{font-size:24px;color:var(--theme);letter-spacing:.5px}
.hero p{font-size:13px;color:var(--sub);margin-top:4px}
.hint{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.hint span{font-size:12px;color:var(--sub);background:#fff;border:1px solid var(--line);padding:5px 10px;border-radius:20px}
.units{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media (min-width:560px){.units{grid-template-columns:repeat(3,1fr)}}
.u-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;cursor:pointer;display:block;text-align:left;width:100%;min-height:0}
.u-card.wide{grid-column:1/-1}
.u-card:active{transform:scale(.98)}
.u-card .un{font-size:12px;color:var(--assoc);font-weight:600}
.u-card .th{font-size:14px;color:var(--ink);margin-top:3px;line-height:1.4}
.u-card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--sub)}
.u-card .pct{font-size:13px;font-weight:700;color:var(--theme)}
.pbar{height:5px;background:#E4EBF2;border-radius:3px;margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--theme);border-radius:3px;width:0}
.usage{font-size:11px;color:var(--sub);text-align:center;margin-top:20px;line-height:1.7}

/* ---------- 品牌（教书匠查理） ---------- */
.brandbar{display:flex;align-items:center;gap:9px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.brandbar .logo{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex:0 0 36px}
.brandbar .bn{font-size:16px;font-weight:800;color:var(--theme);letter-spacing:.5px}
.brandbar .bn i{font-style:normal;color:var(--assoc);font-weight:600;font-size:12px;margin-left:6px}
.brandbar .tag{font-size:11px;color:var(--sub);margin-left:auto;text-align:right;line-height:1.5}
.footer{margin-top:26px;padding:14px 0 6px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.footer .logo{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.footer .fn{font-weight:700;color:var(--theme)}
.footer .dot{opacity:.5}
.footer .wx{display:inline-flex;align-items:center;gap:4px;color:#07C160;font-weight:700}
.footer .wx svg{width:18px;height:18px;flex:0 0 18px}
.brandline{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--sub)}
.brandline .logo{width:22px;height:22px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.brandline .fn{font-weight:700;color:var(--theme)}
.brandline .wx{display:inline-flex;align-items:center;gap:3px;color:#07C160;font-weight:700}
.brandline .wx svg{width:15px;height:15px}

/* ---------- 题型导航 ---------- */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-size:12.5px;color:var(--sub);cursor:pointer;position:relative}
.tab.on{background:var(--theme);border-color:var(--theme);color:#fff;font-weight:600}
.tab .done{position:absolute;top:-6px;right:-4px;background:var(--ok);color:#fff;font-size:10px;border-radius:10px;padding:1px 6px;display:none}
.tab .done.show{display:block}
.prog{font-size:12px;color:var(--sub);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}

/* ---------- 题卡 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 16px;margin-bottom:12px}
.q-word{font-size:30px;font-weight:700;color:var(--theme);letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.spk{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:2px solid var(--assoc);color:var(--assoc);background:#fff;border-radius:50%;cursor:pointer;flex:none;transition:.15s}
.spk:active{transform:scale(.92);background:#E8F1FA}
.spk svg{width:20px;height:20px}
.q-meta{font-size:13px;color:var(--sub);margin-top:4px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;font-size:15px;cursor:pointer;text-align:left;min-height:50px;width:100%}
.opt .tag{flex:0 0 26px;height:26px;border-radius:7px;background:var(--bg);color:var(--theme);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.opt.correct{background:#EAF6F0;border-color:var(--ok)}
.opt.wrong{background:#FBEFED;border-color:var(--err)}
.opt:disabled{cursor:default}
.opt.done{opacity:.92}
/* ---------- 题型1 导航（上一题/下一题） ---------- */
.navrow{display:flex;gap:10px;margin-top:14px;max-width:420px;margin-left:auto;margin-right:auto}
.navbtn{flex:1;min-height:46px;border:2px solid var(--assoc);background:#fff;color:var(--theme);border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
.navbtn:active{transform:scale(.97)}
.navbtn.main{background:var(--theme);border-color:var(--theme);color:#fff}
.navbtn:disabled{opacity:.38;cursor:not-allowed}

/* ---------- 反馈条 ---------- */
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.6;display:none}
.fb.show{display:block}
.fb.ok{background:#EAF6F0;border:1px solid #BBDECB;color:#14532D}
.fb.no{background:#FBEFED;border:1px solid #F0C4BE;color:#7B241C}
.fb .big{font-weight:700}

/* ---------- 输入（题型2） ---------- */
.inrow{display:flex;gap:8px;margin-top:14px}
.inrow input{flex:1;min-width:0;font-size:16px;padding:13px 12px;border:1.5px solid var(--line);border-radius:10px;outline:none;background:#fff}
.inrow input:focus{border-color:var(--theme)}
.btn{background:var(--theme);color:#fff;border:none;border-radius:10px;padding:0 20px;font-size:15px;font-weight:600;cursor:pointer;min-height:50px;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--theme);border:1.5px solid var(--theme)}
.btn:disabled{opacity:.5;cursor:default}

/* ---------- 题型3 ---------- */
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.pool .chip{background:#fff;border:1.5px solid var(--assoc);color:var(--theme);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;min-height:42px;display:inline-flex;align-items:center}
.pool .chip.used{opacity:.3;border-style:dashed;pointer-events:none}
.sent{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:15px;line-height:1.8}
.sent .slot{display:inline-block;min-width:96px;border-bottom:2px dashed var(--assoc);color:var(--assoc);font-weight:600;cursor:pointer;text-align:center;padding:2px 8px;border-radius:4px}
.sent .slot.active{background:#E4EEF9;border-bottom-style:solid}
.sent .slot.filled{color:var(--theme);border-bottom-style:solid}
.sent .slot.good{color:var(--ok);border-color:var(--ok);background:#EAF6F0}
.sent .slot.bad{color:var(--err);border-color:var(--err);background:#FBEFED}
.sent .slot.edit{border-style:solid;background:#fff}
.sent .ok-mark{color:var(--ok);font-weight:700;margin-left:4px}
.sent .no-mark{color:var(--err);font-weight:700;margin-left:4px}
.sin{width:104px;border:none;border-bottom:2px solid var(--theme);font-size:15px;font-family:inherit;color:var(--theme);outline:none;background:transparent;padding:2px 4px}
.form-hint{font-size:12px;color:#B45309;font-weight:600}
.t3score{font-size:14px;font-weight:700;color:var(--theme);text-align:center;margin:10px 0}

/* ---------- 小结 / 总结 ---------- */
.tally{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.tally .tt{font-size:15px;font-weight:700;color:var(--theme);margin-bottom:8px}
.tally .row{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px dashed #EDF1F5}
.tally .row:last-child{border-bottom:none}
.mask{position:fixed;inset:0;background:rgba(20,28,40,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.mask.show{display:flex}
.dialog{background:#fff;border-radius:14px;padding:22px 18px;width:100%;max-width:400px;max-height:86vh;overflow:auto}
.dialog h2{font-size:18px;color:var(--theme);margin-bottom:12px}
.dialog .row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px dashed #EDF1F5}
.dialog .row:last-of-type{border-bottom:none}
.dialog .big{font-size:20px;font-weight:700;color:var(--theme)}
.dbtn{display:block;width:100%;margin-top:10px;padding:13px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:none}
.dbtn.main{background:var(--theme);color:#fff}
.dbtn.ghost{background:#fff;color:var(--theme);border:1.5px solid var(--theme)}

/* ---------- 错词页 ---------- */
.wlist{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.wlist .wt{font-size:15px;font-weight:700;color:var(--err);margin-bottom:10px}
.wrow{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed #EDF1F5;font-size:14px;align-items:baseline}
.wrow:last-child{border-bottom:none}
.wrow .w{font-weight:700;color:var(--ink);min-width:0}
.wrow .g{color:var(--sub);font-size:13px}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:20px 0}
.note{font-size:12px;color:var(--sub);line-height:1.7}
.hide{display:none}
</style>
</head>

/* ================= 工具 ================= */
function $(id){return document.getElementById(id)}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function levenshtein(a,b){
  var m=a.length,n=b.length;if(m===0)return n;if(n===0)return m;
  var p=new Array(n+1),c=new Array(n+1),i,j;
  for(j=0;j<=n;j++)p[j]=j;
  for(i=1;i<=m;i++){c[0]=i;for(j=1;j<=n;j++){var cost=a[i-1]===b[j-1]?0:1;c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+cost)}var t=p;p=c;c=t}
  return p[n];
}
var ALL_WORDS=[];
DATA.forEach(function(u){u.words.forEach(function(w){ALL_WORDS.push({u:u.id,w:w.w,ph:w.ph,pos:w.pos,g:w.g})})});
function distractor(word,n){
  var cand=[];
  for(var i=0;i<ALL_WORDS.length;i++){
    var x=ALL_WORDS[i];if(x.w===word.w)continue;
    var s=-levenshtein(word.w,x.w);
    if(x.w.charAt(0)===word.w.charAt(0))s+=1.5;
    if(x.w.substr(0,2)===word.w.substr(0,2))s+=1;
    if(word.pos&&x.pos&&word.pos.charAt(0)===x.pos.charAt(0))s+=0.5;
    var pf=0,L=Math.min(word.w.length,x.w.length);
    for(var k=0;k<L;k++){if(word.w.charAt(k)===x.w.charAt(k))pf++;else break}
    s+=pf*0.8;
    cand.push({x:x,s:s});
  }
  cand.sort(function(a,b){return b.s-a.s});
  return cand.slice(0,n).map(function(o){return o.x});
}

function pget(uid){if(!PROG[uid])PROG[uid]={t1:{ok:0,total:0},t2:{ok:0,total:0},t3:{ok:0,total:0},wrong:[],done:false};return PROG[uid]}
function pct(uid){var p=pget(uid),tot=p.t1.total+p.t2.total+p.t3.total;if(!tot)return -1;return Math.round(100*(p.t1.ok+p.t2.ok+p.t3.ok)/tot)}
function addWrong(uid,w){var p=pget(uid);if(p.wrong.indexOf(w)<0)p.wrong.push(w);save()}
function removeWrong(uid,w){var p=pget(uid),i=p.wrong.indexOf(w);if(i>=0)p.wrong.splice(i,1);save()}

var T1={queue:[],right:0,now:0,lock:false};
function speakT1(){
  var w=T1.now&&T1.now.w;
  if(!w)return;
  if(!('speechSynthesis' in window)){var fb=$('fbT1');if(fb){fb.classList.add('show');fb.className='fb no show';fb.textContent='当前浏览器不支持发音'};return}
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(w);
  u.lang='en-US';u.rate=.85;
  speechSynthesis.speak(u);
}
function startT1(){
  T1={queue:shuffle(curUnit.words.slice()),right:0,now:0,lock:false,rec:[]};
  S.idx=0;renderT1();
}
function renderT1(){
  if('speechSynthesis' in window)speechSynthesis.cancel();
  T1.lock=false;
  if(S.idx>=T1.queue.length){finishT1();return}
  var w=T1.queue[S.idx];T1.now=w;
  var rec=T1.rec[S.idx]||null;
  var dis=distractor(w,3).map(function(x){return {w:x.w,g:x.g,pos:x.pos,right:false}});
  var opts=shuffle([{w:w.w,g:w.g,pos:w.pos,right:true}].concat(dis));
  var letters=['A','B','C','D'];
  var html='<div class="card"><div class="q-word">'+esc(w.w)+
    '<button class="spk" type="button" onclick="speakT1()" title="播放发音" aria-label="播放发音"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>'+
    '</div><div class="q-meta">'+esc(w.ph||'')+(w.pos?'&nbsp; '+esc(w.pos):'')+'</div></div>'+
    '<div class="opts">';
  opts.forEach(function(o,i){
    var cls='opt';
    if(rec&&rec.answered){
      cls+=' done';
      if(o.right)cls+=' correct';
      if(rec.selw===o.w&&!o.right)cls+=' wrong';
    }
    html+='<button class="'+cls+'" data-i="'+i+'" data-right="'+o.right+'" data-w="'+esc(o.w)+'"'+(rec&&rec.answered?' disabled':'')+'>'+
      '<span class="tag">'+letters[i]+'</span><span>'+esc(o.g)+'</span></button>';
  });
  html+='</div>';
  // 反馈区（已答题回看时显示该题结果）
  if(rec&&rec.answered){
    var fbc='fb '+(rec.right?'ok':'no')+' show';
    var fbtxt;
    if(rec.right)fbtxt='<span class="big">&#10003; 正确</span>　'+esc(w.g)+'<br>记一下：'+esc(w.w)+' 是「'+esc(w.g)+'」';
    else{
      var selLetter='';
      for(var oi=0;oi<opts.length;oi++)if(opts[oi].w===rec.selw)selLetter=letters[oi];
      fbtxt='<span class="big">&#10007; 你选了 '+selLetter+'：'+esc(rec.selw)+'（'+esc(rec.selg)+'）</span>'+
        '<br>正确答案：<b>'+esc(w.w)+'（'+esc(w.g)+'）</b> · 形近辨析：'+esc(w.w)+' ≠ '+esc(rec.selw);
    }
    html+='<div class="'+fbc+'" id="fbT1">'+fbtxt+'</div>';
  }else{
    html+='<div class="fb" id="fbT1"></div>';
  }
  // 导航：上一题 / 下一题（答完停留，可回看背诵）
  html+='<div class="navrow">';
  html+='<button class="navbtn" '+(S.idx>0?'onclick="navT1(-1)"':'disabled')+'>上一题</button>';
  if(S.idx>=T1.queue.length-1)html+='<button class="navbtn main" onclick="finishT1()">完成</button>';
  else html+='<button class="navbtn" onclick="navT1(1)">下一题</button>';
  html+='</div>';
  $('stage').innerHTML=html;
  $('progLine').innerHTML='<span>题型1 英选中</span><span>第 '+(S.idx+1)+' / '+T1.queue.length+' 题</span>';
  var btns=$('stage').querySelectorAll('.opt');
  for(var i=0;i<btns.length;i++)btns[i].onclick=function(){if(T1.lock)return;pickT1(this)};
}
function navT1(d){
  var nx=S.idx+d;
  if(nx<0||nx>=T1.queue.length)return;
  S.idx=nx;renderT1();
}
function pickT1(btn){
  T1.lock=true;var p=pget(curUnit.id);
  var w=T1.now,isRight=btn.getAttribute('data-right')==='true';
  var letters=['A','B','C','D'],i=+btn.getAttribute('data-i');
  var selw=btn.getAttribute('data-w'),selg=btn.querySelector('span:last-child').textContent;
  T1.rec[S.idx]={answered:true,right:isRight,sel:i,selw:selw,selg:selg};
  if(isRight){
    T1.right++;p.t1.ok++;p.t1.total++;save();
  }else{
    p.t1.total++;addWrong(curUnit.id,w.w);save();
  }

}

function startT2(){
  T2={queue:shuffle(curUnit.words.slice()),right:0,copyMode:false,copyWord:null};
  S.idx=0;nextT2();
}
function nextT2(){
  if(S.idx>=T2.queue.length){finishT2();return}
  var w=T2.queue[S.idx];T2.usedHint=false;
  $('progLine').innerHTML='<span>题型2 中译英</span><span>第 '+(S.idx+1)+' / '+T2.queue.length+' 题</span>';
  $('stage').innerHTML='<div class="card"><div class="q-word" style="font-size:22px">'+esc(w.pos?w.pos+'　':'')+esc(w.g)+'</div>'+
    (w.ph?'<div class="q-meta">提示：'+(w.ph.indexOf('/')===0?w.ph:'')+'</div>':'')+
    '<div class="inrow"><input id="in2" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入英文单词，回车提交">'+
    '<button class="btn ghost" id="btnHint">提示</button></div>'+
    '<div class="fb" id="fbT2"></div></div>';
  var inp=$('in2');inp.focus();
  $('btnHint').onclick=function(){
    if(T2.usedHint)return;T2.usedHint=true;
    var w=T2.queue[S.idx],mask=w.w.charAt(0);
    for(var i=1;i<w.w.length;i++)mask+=' _';
    $('fbT2').className='fb show';$('fbT2').innerHTML='提示：'+esc(mask)+'（'+w.w.length+' 个字母）——提示后本题答对不计入正确率';
  };
  inp.onkeydown=function(e){if(e.key==='Enter')submitT2()};
}
function submitT2(){
  var w=T2.queue[S.idx];
  var inp=$('in2'),val=inp.value.trim().toLowerCase();
  if(!val)return;
  var fb=$('fbT2');fb.classList.add('show');
  var p=pget(curUnit.id);
  if(T2.copyMode){
    if(val===T2.copyWord.toLowerCase()){T2.copyMode=false;fb.className='fb ok show';fb.innerHTML='<span class="big">&#10003; 记住了！</span>继续下一题';S.idx++;setTimeout(nextT2,900)}
    else{fb.className='fb no show';fb.innerHTML='再对照抄写一遍正确答案：<b>'+esc(T2.copyWord)+'</b>'}
    inp.value='';inp.focus();return;
  }
  if(val===w.w.toLowerCase()){
    T2.right++;
    if(!T2.usedHint){p.t2.ok++;p.t2.total++}
    save();
    fb.className='fb ok show';fb.innerHTML='<span class="big">&#10003; 正确</span>　'+esc(w.w)+' '+esc(w.ph||'')+' · '+esc(w.g);
    S.idx++;setTimeout(nextT2,1100);
  }else{
    p.t2.total++;addWrong(curUnit.id,w.w);save();
    T2.copyMode=true;T2.copyWord=w.w;
    fb.className='fb no show';
    fb.innerHTML='<span class="big">&#10007; 不对</span>　正确答案是 <b>'+esc(w.w)+'</b>（'+esc(w.g)+'）<br>请把正确答案<b>抄写一遍</b>后按回车，强化记忆';
    inp.value='';inp.focus();
  }
}
function finishT2(){
  var p=pget(curUnit.id);
  $('stage').innerHTML='<div class="tally"><div class="tt">题型2 中译英 完成</div>'+
    '<div class="row"><span>答对</span><b>'+T2.right+' / '+T2.queue.length+'</b></div>'+
    '<div class="row"><span>累计正确率</span><b>'+(p.t2.total?Math.round(100*p.t2.ok/p.t2.total)+'%':'--')+'</b></div>'+
    '<button class="dbtn ghost" style="margin-top:12px" onclick="startT2()">再刷一遍</button></div>';
  $('d2').classList.add('show');
  $('progLine').textContent='题型2 完成，可切换到下一题型';
}

/* ================= 题型3：选词填空 ================= */
var T3={slots:[],score:0,pool:[]};
/* ================= 题型3：选词填空（支持适当形式） ================= */
function rootMatch(w,a){
  w=String(w).toLowerCase();a=String(a).toLowerCase();
  if(w===a)return true;
  if(a===w+'s'||a===w+'es'||a===w+'d'||a===w+'ed'||a===w+'ing')return true;
  if(w.length>1&&w.slice(-1)==='y'&&a===w.slice(0,-1)+'ies')return true;
  if(w.slice(-1)==='e'&&(a===w+'d'||a===w.slice(0,-1)+'ing'||a===w.slice(0,-1)+'s'))return true;
  if(w.length>=3&&'bcdfghjklmnpqrstvwxyz'.indexOf(w.slice(-1))>=0&&a===w+w.slice(-1)+'ed')return true;
  if(w.length>=3&&'bcdfghjklmnpqrstvwxyz'.indexOf(w.slice(-1))>=0&&a===w+w.slice(-1)+'ing')return true;
  return false;
}
function findOrig(ans,ws){
  for(var i=0;i<ws.length;i++)if(rootMatch(ws[i],ans))return ws[i];
  return ans;
}
var T3={slots:[],score:0,pool:[],active:-1,edit:-1};
function startT3(){
  var u=curUnit,pc=u.pc;
  if(!pc.ws.length){$('stage').innerHTML='<div class="empty">本单元暂无选词填空数据</div>';$('progLine').textContent='';return}
  var pool=shuffle(pc.ws.slice());
  var slots=[];
  for(var i=0;i<pc.it.length;i++)slots.push({word:null,ans:pc.an[i],orig:findOrig(pc.an[i],pc.ws),state:'empty',hint:''});
  T3={slots:slots,score:0,pool:pool,active:-1,edit:-1};
  renderT3();
}
function renderT3(){
  var u=curUnit,pc=u.pc,html='';
  html+='<div class="pool" id="pool">';
  T3.pool.forEach(function(w,i){
    html+='<button class="chip" data-i="'+i+'" data-w="'+esc(w)+'">'+esc(w)+'</button>';
  });
  html+='</div>';
  html+='<div class="t3score" id="t3s"></div>';
  pc.it.forEach(function(sent,si){
    var s=T3.slots[si];
    html+='<div class="sent">'+(si+1)+'. ';
    var parts=sent.split('___');
    parts.forEach(function(seg,pi){
      html+=esc(seg);
      if(pi<parts.length-1){
        var cls='slot';
        if(s.state==='good')cls+=' good';else if(s.state==='bad'||s.state==='form')cls+=' bad';else if(s.word)cls+=' filled';
        if(T3.active===si)cls+=' active';
        var slotTxt;
        if(T3.edit===si){
          cls+=' edit';
          slotTxt='<input class="sin" data-si="'+si+'" value="'+esc(s.word||'')+'" autocomplete="off" autocapitalize="off" spellcheck="false">';
        }else if(s.state==='good')slotTxt=esc(s.word)+' <span class="ok-mark">&#10003;</span>';
        else if(s.state==='bad'||s.state==='form')slotTxt=esc(s.ans)+' <span class="no-mark">&#10007;</span>';
        else slotTxt=s.word?esc(s.word):'点此选词';
        html+='<span class="'+cls+'" data-si="'+si+'">'+slotTxt+'</span>';
        if(s.state==='form'&&s.hint)html+=' <span class="form-hint">'+s.hint+'</span>';
      }
    });
    html+='</div>';
  });
  $('stage').innerHTML=html;
  $('progLine').innerHTML='<span>题型3 选词填空</span><span>已填 '+filledCount()+' / 10</span>';
  document.querySelectorAll('#pool .chip').forEach(function(c){c.onclick=function(){pickChip(+c.getAttribute('data-i'))}});
  document.querySelectorAll('.slot').forEach(function(sl){sl.onclick=function(){clickSlot(+sl.getAttribute('data-si'))}});
  if(T3.edit>=0){
    var inp=document.querySelector('.sin');
    if(inp){inp.focus();inp.select();inp.onkeydown=function(e){if(e.key==='Enter')submitSlot(T3.edit);if(e.key==='Escape'){T3.edit=-1;renderT3()}}}
  }
  if(T3.score>0)$('t3s').textContent='本题得分：'+T3.score+' / 10';
}
function filledCount(){var n=0;T3.slots.forEach(function(s){if(s.word)n++});return n}
function pickChip(i){
  var w=T3.pool[i];
  var si=-1;
  if(T3.active>=0&&!T3.slots[T3.active].word)si=T3.active;
  else{for(var k=0;k<T3.slots.length;k++)if(!T3.slots[k].word){si=k;break}}
  if(si<0)return;
  T3.slots[si].word=w;
  T3.pool.splice(i,1);
  T3.active=-1;
  checkSlot(si);
}
function clickSlot(si){
  var s=T3.slots[si];
  if(T3.edit===si){T3.edit=-1;renderT3();return}
  if(s.state==='form'){ // 形式不对：点击进入编辑，改成适当形式
    T3.edit=si;renderT3();return;
  }
  if(s.state==='good'||s.state==='bad'){ // 已判定：点击取出重填
    T3.pool.push(s.word);T3.slots[si].word=null;s.state='empty';s.hint='';T3.edit=-1;renderT3();return;
  }
  if(s.word){ // 已填未判：点击进入编辑
    T3.edit=(T3.edit===si?-1:si);renderT3();return;
  }
  T3.active=(T3.active===si?-1:si);renderT3();
}
function submitSlot(si){
  var s=T3.slots[si],inp=document.querySelector('.sin');
  var val=inp?inp.value.trim():'';
  if(!val){ // 清空回车 = 取出重填
    T3.pool.push(s.word);T3.slots[si].word=null;s.state='empty';s.hint='';T3.edit=-1;renderT3();return;
  }
  s.word=val;T3.edit=-1;checkSlot(si);
}
function checkSlot(si){
  var s=T3.slots[si],p=pget(curUnit.id);
  var val=s.word.toLowerCase(),ans=s.ans.toLowerCase(),orig=s.orig.toLowerCase();
  if(val===ans){s.state='good';p.t3.ok++;T3.score++;s.hint=''}
  else if(val===orig&&orig!==ans){
    s.state='form';s.hint='注意形式：'+esc(s.orig)+' → '+esc(s.ans);
    addWrong(curUnit.id,s.orig);
  }
  else{
    s.state='bad';s.hint='';
    addWrong(curUnit.id,s.orig);
  }
  p.t3.total++;save();
  renderT3();
  if(filledCount()===T3.slots.length)setTimeout(finishT3,600);
}
function finishT3(){
  var p=pget(curUnit.id);
  $('stage').innerHTML='<div class="tally"><div class="tt">题型3 选词填空 完成</div>'+
    '<div class="row"><span>本题得分</span><b>'+T3.score+' / 10</b></div>'+
    '<div class="row"><span>累计正确率</span><b>'+(p.t3.total?Math.round(100*p.t3.ok/p.t3.total)+'%':'--')+'</b></div>'+
    '<button class="dbtn ghost" style="margin-top:12px" onclick="startT3()">再刷一遍</button></div>';
  $('d3').classList.add('show');
  $('progLine').textContent='题型3 完成';
  // 三题型齐了，弹总结
  var done=p.t1.total>0&&p.t2.total>0&&p.t3.total>0;
  if(done&&!p.done){p.done=true;save();showSum()}
}

/* ================= 总结 ================= */
function showSum(){
  var p=pget(curUnit.id);
  $('sumTitle').textContent=curUnit.name+' 总结';
  $('sumBody').innerHTML=
    '<div class="row"><span>题型1 英选中</span><b>'+p.t1.ok+' / '+p.t1.total+'</b></div>'+
    '<div class="row"><span>题型2 中译英</span><b>'+p.t2.ok+' / '+p.t2.total+'</b></div>'+
    '<div class="row"><span>题型3 选词填空</span><b>'+p.t3.ok+' / '+p.t3.total+'</b></div>'+
    '<div class="row"><span>掌握率</span><b class="big">'+pct(curUnit.id)+'%</b></div>'+
    '<div class="row"><span>错词数</span><b>'+(p.wrong.length?p.wrong.length+' 个':'0，太稳了')+'</b></div>';
  $('maskSum').classList.add('show');
}
$('btnRerunWrong').onclick=function(){$('maskSum').classList.remove('show');openReview()};
$('btnSumHome').onclick=function(){$('maskSum').classList.remove('show');renderHome();show('home')};

/* ================= 错词回顾 ================= */
function openReview(){
  var p=pget(curUnit.id);
  $('rTitle').textContent=curUnit.name+' · 错词回顾';
  var box=$('reviewBox');
  if(!p.wrong.length){
    box.innerHTML='<div class="empty">本单元没有错词，继续保持</div>';
    return;
  }
  var html='<div class="wlist"><div class="wt">错词本（'+p.wrong.length+' 个）</div>';
  p.wrong.forEach(function(w){
    var g='';
    for(var i=0;i<ALL_WORDS.length;i++)if(ALL_WORDS[i].w===w&&ALL_WORDS[i].u===curUnit.id){g=ALL_WORDS[i].g;break}
    html+='<div class="wrow"><span class="w">'+esc(w)+'</span><span class="g">'+esc(g)+'</span></div>';
  });
  html+='</div><button class="btn" style="width:100%" id="btnRewrong">一键重刷错词（'+p.wrong.length+' 个）</button>';
  box.innerHTML=html;
  $('btnRewrong').onclick=startWrongQuiz;
  show('review');
}
function startWrongQuiz(){
  var p=pget(curUnit.id),wl=p.wrong.slice();
  if(!wl.length)return;
  // 在 review 页渲染题型1模式
  S={t:1,idx:0};
  T1={queue:wl.map(function(w){
    for(var i=0;i<ALL_WORDS.length;i++)if(ALL_WORDS[i].w===w&&ALL_WORDS[i].u===curUnit.id)return ALL_WORDS[i];
    return {w:w,ph:'',pos:'',g:''};
  }),right:0,now:null,lock:false};
  $('progLine').innerHTML='<span>错词重刷（英选中）</span><span>第 1 / '+wl.length+' 题</span>';
  renderWrongQ();
}
function renderWrongQ(){
  var p=pget(curUnit.id);
  if(S.idx>=T1.queue.length){ // 结束
    $('reviewBox').innerHTML='<div class="tally"><div class="tt">错词重刷完成</div>'+
      '<div class="row"><span>剩余错词</span><b>'+(p.wrong.length?p.wrong.length+' 个':'0 个，全部拿下')+'</b></div>'+
      '<button class="dbtn ghost" style="margin-top:12px" onclick="openReview()">查看错词本</button>'+
      '<button class="dbtn main" style="margin-top:8px" onclick="renderHome();show(\'home\')">返回首页</button></div>';
    $('progLine').textContent='重刷完成，做对的已移出错词本';
    return;
  }
  var w=T1.queue[S.idx];T1.now=w;
  var dis=distractor(w,3).map(function(x){return {w:x.w,g:x.g,pos:x.pos,right:false}});
  var opts=shuffle([{w:w.w,g:w.g,pos:w.pos,right:true}].concat(dis));
  var letters=['A','B','C','D'];
  var html='<div class="card"><div class="q-word">'+esc(w.w)+'</div>'+
    '<div class="q-meta">'+esc(w.ph||'')+(w.pos?'&nbsp; '+esc(w.pos):'')+'</div></div><div class="opts">';
  opts.forEach(function(o,i){html+='<button class="opt" data-i="'+i+'" data-right="'+o.right+'"><span class="tag">'+letters[i]+'</span><span>'+esc(o.g)+'</span></button>'});
  html+='</div><div class="fb" id="fbRW"></div>';
  $('reviewBox').innerHTML=html;
  $('progLine').innerHTML='<span>错词重刷（英选中）</span><span>第 '+(S.idx+1)+' / '+T1.queue.length+' 题</span>';
  var btns=$('reviewBox').querySelectorAll('.opt');
  for(var i=0;i<btns.length;i++)btns[i].onclick=function(){if(T1.lock)return;pickWrong(this)};
}
function pickWrong(btn){
  T1.lock=true;var p=pget(curUnit.id),w=T1.now;
  var isRight=btn.getAttribute('data-right')==='true';
  var letters=['A','B','C','D'],si=+btn.getAttribute('data-i');
  var opts=$('reviewBox').querySelectorAll('.opt');
  for(var k=0;k<opts.length;k++){var rb=opts[k].getAttribute('data-right')==='true';opts[k].disabled=true;if(rb)opts[k].classList.add('correct')}
  var fb=$('fbRW');fb.classList.add('show');
  if(isRight){
    btn.classList.add('correct');
    removeWrong(curUnit.id,w.w);
    p.t1.ok++;p.t1.total++;save();
    fb.className='fb ok show';fb.innerHTML='<span class="big">&#10003; 正确</span>　'+esc(w.g)+'（已移出错词本）';
    setTimeout(function(){T1.lock=false;S.idx++;renderWrongQ()},1000);
  }else{
    btn.classList.add('wrong');
    p.t1.total++;save();
    fb.className='fb no show';
    fb.innerHTML='<span class="big">&#10007; 还差一点</span>　'+esc(w.w)+' 是「'+esc(w.g)+'」，下次再战';
    setTimeout(function(){T1.lock=false;S.idx++;renderWrongQ()},1600);
  }
}

/* ================= 事件绑定 ================= */
$('btnBack').onclick=function(){renderHome();show('home')};
$('btnRBack').onclick=function(){renderHome();show('home')};
document.querySelectorAll('.tab').forEach(function(b){
  b.onclick=function(){if(curUnit)switchTab(+b.getAttribute('data-t'))};
});
$('maskSum').onclick=function(e){if(e.target===$('maskSum'))$('maskSum').classList.remove('show')};

renderHome();
</script>
